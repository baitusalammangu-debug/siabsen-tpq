window.__siap = false; window.__galat = [];

    (document.body || document.documentElement).appendChild(d);
  }

  for (var i = 0; i < window.__galat.length; i++) {

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --hijau:#0f5132; --hijau2:#198754; --hijau-muda:#e7f3ec; --emas:#c9a227; --krem:#f8f5ec;
  --teks:#1d2a23; --redup:#66756c; --garis:#e4dfd0; --kartu:#ffffff;
  --hadir:#198754; --izin:#2f6fd6; --sakit:#d99214; --alpa:#c9372c;
  --r:14px; --bayang:0 1px 2px rgba(15,81,50,.06),0 4px 16px rgba(15,81,50,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--krem);color:var(--teks);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0;line-height:1.25}
h3{font-size:16px;font-weight:700}
small{font-size:12.5px}
.muted{color:var(--redup)}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(1200px 500px at 50% -10%,#1a6b46 0%,var(--hijau) 55%,#0a3a24 100%)}
.login-box{width:100%;max-width:380px;background:var(--kartu);border-radius:20px;padding:28px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.logo{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;margin:0 auto 12px;padding:8px;box-shadow:0 0 0 3px var(--emas),0 6px 18px rgba(15,81,50,.18)}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.metode{display:flex;align-items:center;justify-content:center;gap:8px;margin:-8px 0 18px;font-size:12.5px;font-weight:700;color:var(--hijau)}
.metode img{width:26px;height:26px;object-fit:contain}
.login-box h2{text-align:center;font-size:20px}
.login-box .sub{text-align:center;color:var(--redup);font-size:13.5px;margin:4px 0 20px}
.login-foot{color:#cfe3d7;font-size:12.5px;margin-top:18px;text-align:center}

/* ---------- Form ---------- */
label{display:block;font-size:13px;font-weight:600;color:#3c4a42;margin:0 0 12px}
.inp{display:block;width:100%;margin-top:5px;padding:11px 12px;border:1.5px solid var(--garis);border-radius:10px;background:#fff;outline:none;font-size:15px;font-weight:500}
.inp:focus{border-color:var(--hijau2);box-shadow:0 0 0 3px rgba(25,135,84,.15)}
textarea.inp{resize:vertical;min-height:70px}
.inp.auto{width:auto;margin:0;padding:7px 10px;font-size:14px}
.inp.kecil{margin-top:8px;padding:8px 10px;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cek{display:flex;align-items:center;gap:8px;font-weight:500;margin:10px 0 4px}
.cek input{width:18px;height:18px;accent-color:var(--hijau2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--hijau-muda);color:var(--hijau);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;pointer-events:none}
.btn.primer{background:var(--hijau);color:#fff}
.btn.lebar{width:100%;margin-top:4px;padding:13px}
.btn.kecil{padding:7px 12px;font-size:13px}
.btn.garis{background:transparent;box-shadow:inset 0 0 0 1.5px var(--garis);color:var(--teks)}
.btn.bahaya{background:#fdecea;color:var(--alpa)}
.link{background:none;border:0;color:var(--alpa);font-size:12.5px;font-weight:600;cursor:pointer;padding:4px}

/* ---------- App shell ---------- */
header{position:sticky;top:0;z-index:20;background:var(--hijau);color:#fff}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px 10px;max-width:760px;margin:0 auto}
.top .logo{width:40px;height:40px;margin:0;padding:3px;box-shadow:0 0 0 2px var(--emas)}
.jilid-list{display:flex;flex-direction:column;gap:6px}
.jilid-list div{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;background:#faf8f1;border:1px solid #efeadf;font-weight:600;font-size:14px}
.jilid-list span{font-size:12.5px;color:var(--redup);font-weight:500}
.pilih{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid #f0ece2;font-weight:500;margin:0;font-size:14.5px;color:var(--teks)}
.pilih:first-child{border-top:0}
.pilih input{width:20px;height:20px;accent-color:var(--hijau2);flex:none}
.tujuan{background:var(--hijau-muda);color:var(--hijau);border-radius:10px;padding:10px 12px;font-size:14px;margin:4px 0 12px}
.top .nama{flex:1;min-width:0}
.top .nama b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .nama span{font-size:12px;color:#bfe0cd}
.peran{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--emas);color:#2b2104;padding:3px 8px;border-radius:99px}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;max-width:760px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:rgba(255,255,255,.1);color:#e3f1e9;border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
nav button.on{background:#fff;color:var(--hijau)}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}

.card{background:var(--kartu);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--bayang);border:1px solid #efeadf}
.card h3{margin-bottom:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar h3{margin:0}
.hero{padding:4px 2px 14px}
.hero h2{font-size:21px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pintas{background:var(--kartu);border:1px solid #efeadf;border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;box-shadow:var(--bayang);display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:14px}
.pintas svg{width:26px;height:26px;color:var(--hijau2)}
.info{background:#fff8e1;border:1px solid #f1e2a8;color:#6d5510;border-radius:10px;padding:9px 12px;font-size:13px;margin:0 0 12px}
.kosong{text-align:center;color:var(--redup);padding:18px 8px;font-size:14px}
.err{background:#fdecea;color:#8c2019;border-radius:10px;padding:12px;font-size:14px}

/* status */
.st-Hadir{--c:var(--hadir)} .st-Izin{--c:var(--izin)} .st-Sakit{--c:var(--sakit)} .st-Alpa{--c:var(--alpa)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;color:var(--c,var(--hijau));background:color-mix(in srgb,var(--c,var(--hijau)) 12%,#fff)}
.absen-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.absen-btns .btn{background:color-mix(in srgb,var(--c) 11%,#fff);color:var(--c);padding:14px 6px}
.absen-btns .btn:first-child{background:var(--hadir);color:#fff}
.status-box{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,#fff);margin-bottom:10px}
.status-box .ikon{width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;flex:none}
.status-box .besar{font-size:20px;font-weight:800;color:var(--c)}
details.ubah summary{cursor:pointer;color:var(--hijau2);font-weight:600;font-size:13.5px;margin-bottom:10px}

/* daftar absensi santri */
.srow{padding:11px 0;border-top:1px solid #f0ece2}
.srow:first-child{border-top:0}
.srow .atas{display:flex;align-items:center;gap:10px}
.snama{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.snama .no{width:24px;font-size:12px;color:var(--redup);text-align:right;flex:none}
.snama b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snama small{color:var(--redup)}
.seg{display:flex;gap:4px;flex:none}
.seg button{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--garis);background:#fff;font-weight:800;font-size:13px;color:var(--redup);cursor:pointer}
.seg button.on{background:var(--c);border-color:var(--c);color:#fff}
.ringkas{display:flex;gap:6px;flex-wrap:wrap}

/* statistik */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.stat{border-radius:12px;padding:10px 6px;text-align:center;background:color-mix(in srgb,var(--c) 9%,#fff)}
.stat b{display:block;font-size:22px;color:var(--c);line-height:1.1}
.stat span{font-size:11.5px;font-weight:600;color:#4b5a51}
.progress{height:10px;background:#eee8da;border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--hijau2),#34b37a);border-radius:99px}

/* list item */
.item{padding:12px 0;border-top:1px solid #f0ece2}
.item:first-child{border-top:0;padding-top:2px}
.item .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--redup);margin-bottom:4px}
.item .judul{font-weight:700}
.item p{margin:3px 0 0;font-size:14px;white-space:pre-wrap}
.item .aksi{display:flex;justify-content:flex-end}
.profil{display:flex;align-items:center;gap:14px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--hijau);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:inset 0 0 0 3px var(--emas);flex:none}

/* tabel */
.tabel-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 5px;text-align:center;border-bottom:1px solid #f0ece2}
th{font-size:12px;color:var(--redup);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
td:first-child,th:first-child{text-align:left}
td.pct{font-weight:700}


/* ---------- data induk ---------- */
.orang{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid #f0ece2;padding:11px 2px;cursor:pointer}
.orang:first-of-type{border-top:0}
.orang .o-info{flex:1;min-width:0;display:flex;flex-direction:column}
.orang .o-info b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orang small{color:var(--redup);font-size:12.5px}
.panah{color:var(--redup);font-size:22px;line-height:1}
.avatar{overflow:hidden}
.avatar.kecil{width:44px;height:44px;font-size:15px;box-shadow:inset 0 0 0 2px var(--emas)}
.avatar img,.pasfoto img{width:100%;height:100%;object-fit:cover;display:block}
.pasfoto{width:96px;height:124px;border-radius:12px;background:var(--hijau-muda);color:var(--hijau);display:grid;place-items:center;font-weight:800;font-size:24px;overflow:hidden;flex:none;border:2px solid var(--emas)}
.kop{display:flex;gap:16px;align-items:center}
.label-kecil{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--hijau2)}
.bagian{margin-top:18px}
.bagian h4,.sub-judul{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--hijau2);margin:0 0 6px;padding-bottom:6px;border-bottom:1.5px solid var(--hijau-muda)}
.sub-judul{margin:20px 0 12px}
.bio{display:grid;grid-template-columns:40% 60%;margin:0;font-size:14px}
.bio dt{color:var(--redup);padding:7px 8px 7px 0;overflow-wrap:anywhere;border-bottom:1px dashed #ece6d6}
.bio dd{margin:0;padding:7px 0;font-weight:600;border-bottom:1px dashed #ece6d6;word-break:break-word}
.bio a{color:var(--hijau2);text-decoration:none}
.aksi-bawah{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.aksi-bawah .btn{flex:1;min-width:120px}
.foto-edit{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.akun-baru{background:#fff8e1;border:1.5px dashed var(--emas);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;color:#5b4608}
.kredensial{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0;font-size:15px}
.kredensial span{color:#8a7430}
.kredensial b{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
.sorot{box-shadow:0 0 0 2px var(--hijau2),var(--bayang)}
/* syahriyah */
.stats.dua{grid-template-columns:1fr 1fr}
.stats.dua .stat b{font-size:17px}
.uang{font-variant-numeric:tabular-nums;white-space:nowrap}
.sy-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #f0ece2}
.sy-row:first-child{border-top:0}
.sy-nama{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column}
.sy-nama b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sy-nama small{color:var(--redup);font-size:12.5px}
.bulan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;margin-top:12px}
.bulan-grid div{border-radius:10px;padding:8px 4px;text-align:center;font-size:12.5px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff)}
.bulan-grid span{display:block;font-size:11px;font-weight:600;opacity:.85}
.kuitansi{border:1.5px solid var(--garis)}
.k-kop{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:3px double var(--hijau)}
.k-kop img{width:52px;height:52px;object-fit:contain}
.k-kop b{display:block;font-size:16px;color:var(--hijau)}
.k-kop small{color:var(--redup);font-size:12px}
.k-judul{text-align:center;font-size:14px;letter-spacing:.06em;margin:14px 0 8px!important}
.k-terbilang{font-size:13.5px;margin:10px 0}
.k-ttd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:13.5px;margin-top:8px}

/* jilid diampu */
.jilid-saya{display:flex;flex-direction:column;gap:8px}
.jilid-saya>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#faf8f1;border:1px solid #efeadf}
.jilid-saya b{flex:1;font-size:14.5px}
.jilid-saya small{color:var(--redup);font-size:12.5px}
.jl-nama{display:flex;flex-direction:column;color:var(--teks)!important;font-size:14px!important;font-weight:600!important}
.jl-nama small{color:var(--redup);font-weight:500;font-size:12px}
.pilih-jilid{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.pilih-jilid label{display:inline-flex;align-items:center;gap:6px;margin:0;padding:7px 11px;border-radius:99px;border:1.5px solid var(--garis);background:#fff;font-weight:600;font-size:13px;cursor:pointer}
.pilih-jilid label.on{border-color:var(--hijau2);background:var(--hijau-muda);color:var(--hijau)}
.pilih-jilid input{width:16px;height:16px;accent-color:var(--hijau2);margin:0}


/* ====== tampilan baru: dashboard & navigasi bawah ====== */
header{box-shadow:0 1px 0 rgba(255,255,255,.06)}
.top{padding:10px 16px}
.sinkron{width:8px;height:8px;border-radius:50%;background:#7fd3a6;opacity:0;transition:opacity .3s}
.sinkron.on{opacity:1;animation:denyut 1s ease-in-out infinite}
@keyframes denyut{50%{transform:scale(.5);opacity:.4}}
main{padding:16px 16px 96px}
#navBawah{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;gap:2px;
  max-width:760px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid #ece6d6;box-shadow:0 -6px 24px rgba(15,81,50,.08)}
#navBawah button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0 4px;
  color:#7b867f;font-size:11px;font-weight:700;cursor:pointer;border-radius:12px;transition:color .15s}
#navBawah .ni{width:42px;height:28px;display:grid;place-items:center;border-radius:99px;transition:background .2s}
#navBawah svg{width:22px;height:22px}
#navBawah button.on{color:var(--w)}
#navBawah button.on .ni{background:color-mix(in srgb,var(--w) 14%,#fff)}
#isi > *{animation:muncul .25s ease both}
@keyframes muncul{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.hero{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 16px;margin:0 0 14px;color:#fff;
  background:linear-gradient(135deg,#0f5132 0%,#157347 55%,#1f8a5b 100%);box-shadow:0 10px 30px rgba(15,81,50,.25)}
.hero-pola{position:absolute;inset:0;opacity:.13;pointer-events:none;
  background-image:url("data:image/svg+xml,%3Csvg xmlns='http:%2F%2Fwww.w3.org/2000/svg' width='56' height='56' viewBox='0 0 56 56'%3E%3Cg fill='none' stroke='%23fff' stroke-width='1.2'%3E%3Cpath d='M28 6l6.4 15.6L50 28l-15.6 6.4L28 50l-6.4-15.6L6 28l15.6-6.4z'/%3E%3Crect x='17' y='17' width='22' height='22' transform='rotate(45 28 28)'/%3E%3C/g%3E%3C/svg%3E");background-size:56px}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,162,39,.45),transparent 70%)}
.hero-atas{position:relative;z-index:1;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.hero h2{font-size:21px;line-height:1.3;margin:4px 0 0;font-weight:800;color:#fff}
.hero-tgl{font-size:12.5px;color:#cfe8d9;font-weight:600}

<script>
/* Penghubung ke server Cloudflare: google.script.run.fungsi(...) -> POST /api */
(function () {
  function buat(ok, gagal) {
    return new Proxy({}, { get: function (_, nama) {
      if (nama === 'withSuccessHandler') return function (f) { return buat(f, gagal); };
      if (nama === 'withFailureHandler') return function (f) { return buat(ok, f); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        fetch('/api', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ fn: nama, args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (j) { if (j && j.ok) { if (ok) ok(j.hasil); } else if (gagal) gagal(new Error((j && j.galat) || 'Terjadi kesalahan.')); })
          .catch(function () { if (gagal) gagal(new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.')); });
      };
    } });
  }
  window.google = { script: { run: buat(null, null) } };
  if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
})();
</script>
